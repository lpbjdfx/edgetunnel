name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 8 * * 1"   # 每周一 UTC 00:00
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main

          if git diff --quiet HEAD upstream/main; then
            git reset --hard upstream/main
            git push --force-with-lease origin main
          else
            if ! git pull --no-rebase upstream main; then
              echo "[Error] 合并冲突，请手动 Sync Fork 并解决冲突。"
              exit 1
            fi
            git push origin main
          fi

      # 关键：同步完强制把频率改回每周，防止被上游冲掉
      - name: Keep weekly schedule
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          # 把每天改回每周一
          sed -i 's/cron: "0 0 \* \* \*"/cron: "0 0 * * 1"/' .github/workflows/sync.yml || true
          sed -i "s/cron: '0 0 \* \* \*'/cron: '0 0 * * 1'/" .github/workflows/sync.yml || true

          if ! git diff --quiet .github/workflows/sync.yml; then
            git add .github/workflows/sync.yml
            git commit -m "chore: keep weekly upstream sync schedule"
            git push origin main
          fi
